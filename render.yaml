services:
  - type: web
    name: iris
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: '*'
      - key: SESSION_TIMEOUT
        value: '3600000'
      - key: REDIS_URL
        sync: false
